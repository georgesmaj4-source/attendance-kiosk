# Keeps the free Render app awake so the first clock-in of the day is instant.
# Runs on GitHub's servers (no computer needed) and just pings the health check.
# Note: GitHub pauses scheduled workflows after ~60 days with no repo activity.
name: keep-alive
on:
  schedule:
    - cron: '*/12 * * * *'   # roughly every 12 minutes
  workflow_dispatch:          # lets you run it by hand from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the kiosk so Render does not sleep it
        run: curl -sS --max-time 30 https://attendance-kiosk.onrender.com/healthz || true
